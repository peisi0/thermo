    const tbody = document.getElementById('vocab-tbody');

    // 辅助函数：根据单元获取对应的标签颜色 class
    function getUnitClass(unit) {
        if(unit === 'Unit 5') return 'u5';
        if(unit === 'Unit 6') return 'u6';
        if(unit === 'Unit 7') return 'u7';
        if(unit === 'Unit 8') return 'u8';
        return '';
    }

    // 渲染表格数据的函数
    function renderTable(data) {
        tbody.innerHTML = '';
        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><span class="unit-tag ${getUnitClass(item.unit)}">${item.unit}</span></td>
                <td><strong>${item.word}</strong></td>
                <td><span class="type-tag">${item.type}</span></td>
                <td>${item.meaning}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // 筛选单元格的过滤函数
    function filterUnit(unitName) {
        // 更新按钮的高亮样式
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (unitName === 'all') {
            renderTable(vocab_data);
        } else {
            const filtered = vocab_data.filter(item => item.unit === unitName);
            renderTable(filtered);
        }
    }

    // 页面首次加载时渲染全部数据
    renderTable(vocab_data);
