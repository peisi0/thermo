<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多邻国风格单词记忆卡</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #3c3c3c;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 550px;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* Welcome & Filter Screen */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            flex-grow: 1;
        }
        .screen.active {
            display: flex;
        }
        
        .header-title {
            font-size: 28px;
            font-weight: 800;
            color: #58cc02;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .header-subtitle {
            font-size: 16px;
            color: #777777;
            text-align: center;
            margin-bottom: 32px;
        }
        
        /* Duolingo Style Unit Selector Boxes */
        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 40px;
        }
        .unit-card {
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            background: white;
        }
        .unit-card:active {
            transform: translateY(4px);
            border-bottom-width: 1px;
        }
        .unit-card.selected {
            border-color: #84d8ff;
            background-color: #ddf4ff;
            border-bottom-color: #1899d6;
            color: #1899d6;
        }
        .unit-card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .unit-card-count {
            font-size: 13px;
            color: #777777;
        }
        .unit-card.selected .unit-card-count {
            color: #1899d6;
        }

        /* Progress Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 10px 0;
        }
        .close-btn {
            font-size: 24px;
            font-weight: bold;
            color: #afafaf;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0 10px;
        }
        .close-btn:hover {
            color: #3c3c3c;
        }
        .progress-container {
            flex-grow: 1;
            background-color: #e5e5e5;
            height: 16px;
            border-radius: 8px;
            margin: 0 16px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            background-color: #58cc02;
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 4px;
            right: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        .counter-text {
            font-size: 14px;
            font-weight: 700;
            color: #afafaf;
            min-width: 45px;
            text-align: right;
        }

        /* Card Section */
        .flashcard-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }
        .card-box {
            width: 100%;
            background: white;
            border: 2px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
            border-radius: 24px;
            padding: 48px 24px;
            text-align: center;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 0px rgba(0,0,0,0.02);
        }
        .word-text {
            font-size: 34px;
            font-weight: 800;
            color: #3c3c3c;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .word-type {
            font-size: 16px;
            color: #afafaf;
            font-style: italic;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .unit-tag {
            display: inline-block;
            padding: 6px 14px;
            background-color: #e5f5ff;
            color: #1899d6;
            font-weight: 700;
            font-size: 12px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        
        /* Target Reveal Area */
        .meaning-box {
            width: 100%;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 2px dashed #e5e5e5;
            visibility: hidden;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .meaning-box.show {
            visibility: visible;
            opacity: 1;
            transform: scale(1);
        }
        .meaning-title {
            font-size: 13px;
            color: #ff9600;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .meaning-text {
            font-size: 24px;
            color: #ff9600;
            font-weight: 800;
            margin: 0;
        }
        .example-box {
            margin-top: 14px;
            text-align: left;
        }
        .example-title {
            font-size: 12px;
            color: #58cc02;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .example-list {
            margin: 0;
            padding-left: 18px;
            color: #4b4b4b;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Footer & Duolingo Action Buttons */
        .footer-action {
            padding: 16px 0;
            border-top: 2px solid #e5e5e5;
            background: white;
        }
        .btn-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
        }
        .duo-btn {
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            user-select: none;
            flex: 1;
            transition: filter 0.1s;
            border: none;
            outline: none;
        }
        .duo-btn:active {
            transform: translateY(4px);
        }
        
        .btn-know {
            background-color: #58cc02;
            color: white;
            border-bottom: 5px solid #46a302;
        }
        .btn-know:active {
            border-bottom-width: 1px;
        }
        
        .btn-dontknow {
            background-color: white;
            color: #afafaf;
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
        }
        .btn-dontknow:hover {
            background-color: #fafafa;
        }
        .btn-dontknow:active {
            border-bottom-width: 1px;
            background-color: #f5f5f5;
        }
        
        .btn-primary {
            background-color: #58cc02;
            color: white;
            border-bottom: 5px solid #46a302;
            width: 100%;
        }
        .btn-primary:active {
            border-bottom-width: 1px;
        }
        
        .btn-continue {
            background-color: #ff9600;
            color: white;
            border-bottom: 5px solid #e07b00;
            width: 100%;
        }
        .btn-continue:active {
            border-bottom-width: 1px;
        }

        /* Results & Review Panel */
        .results-box {
            text-align: center;
            padding: 24px 8px;
            flex-grow: 1;
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
        }
        .stat-card.correct-card {
            border-color: #b8f28b;
            background-color: #f7fff0;
            color: #46a302;
        }
        .stat-card.wrong-card {
            border-color: #ffc1c1;
            background-color: #fff5f5;
            color: #ea2b2b;
        }
        .stat-num {
            font-size: 28px;
            font-weight: 800;
        }
        .stat-lbl {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.8;
        }
        
        .review-title {
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            margin: 24px 0 12px 0;
            color: #3c3c3c;
        }
        .review-list {
            max-height: 250px;
            overflow-y: auto;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            padding: 8px;
            text-align: left;
            margin-bottom: 24px;
        }
        .review-item {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .review-word {
            font-weight: 700;
            color: #3c3c3c;
        }
        .review-mean {
            color: #ff9600;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div id="screen-filter" class="screen active">
        <div>
            <div class="header-title">选择学习难度</div>
            <div class="header-subtitle">先选择难度，再开始单词记忆</div>
            
            <div class="filter-group">
                <div class="unit-card" data-difficulty="primary" onclick="toggleDifficulty(this)">
                    <div class="unit-card-title">小学难度</div>
                    <div class="unit-card-count">基础高频词汇</div>
                </div>
                <div class="unit-card selected" data-difficulty="middle" onclick="toggleDifficulty(this)">
                    <div class="unit-card-title">中学难度</div>
                    <div class="unit-card-count">进阶词汇 + 例句训练</div>
                </div>
            </div>
        </div>
        
        <div class="footer-action">
            <button class="duo-btn btn-primary" onclick="startLearning()">开始学习</button>
        </div>
    </div>

    <div id="screen-learn" class="screen">
        <div class="top-bar">
            <button class="close-btn" onclick="quitSession()">×</button>
            <div class="progress-container">
                <div id="progress" class="progress-bar"></div>
            </div>
            <div id="counter" class="counter-text">0/0</div>
        </div>
        
        <div class="flashcard-wrapper">
            <div class="card-box">
                <div id="card-word" class="word-text">word</div>
                <div id="card-type" class="word-type">n. phr.</div>
                <div id="card-unit" class="unit-tag">Unit 5</div>
                
                <div id="meaning-container" class="meaning-box">
                    <div class="meaning-title">详细解释</div>
                    <div id="card-meaning" class="meaning-text">释义</div>
                    <div id="example-container" class="example-box" style="display:none;">
                        <div class="example-title">例句</div>
                        <ul id="card-examples" class="example-list"></ul>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer-action">
            <div id="choice-buttons" class="btn-container">
                <button class="duo-btn btn-dontknow" onclick="handleDontKnow()">不会</button>
                <button class="duo-btn btn-know" onclick="handleKnow()">会</button>
            </div>
            <div id="continue-buttons" class="btn-container" style="display: none;">
                <button class="duo-btn btn-continue" onclick="advanceNext()">继续</button>
            </div>
        </div>
    </div>

    <div id="screen-results" class="screen">
        <div class="results-box">
            <div class="header-title" style="margin-top:20px;">太棒了！</div>
            <div class="header-subtitle">你已经完成了本次选择的词汇卡学习</div>
            
            <div class="stats-row">
                <div class="stat-card correct-card">
                    <div id="stat-known" class="stat-num">0</div>
                    <div class="stat-lbl">一次记牢</div>
                </div>
                <div class="stat-card wrong-card">
                    <div id="stat-unknown" class="stat-num">0</div>
                    <div class="stat-lbl">需要复习</div>
                </div>
            </div>
            
            <div id="review-panel" style="display: none;">
                <div class="review-title">重点复习词汇清单：</div>
                <div id="review-list-container" class="review-list">
                    </div>
            </div>
        </div>
        
        <div class="footer-action">
            <button class="duo-btn btn-primary" onclick="restartApp()">重新开始</button>
        </div>
    </div>

</div>

<script src="vocabulary-data.js"></script>
<script>
    const vocabularyData = window.ENGS3_VOCAB_DATA || {};
    const primaryVocabularyList = Array.isArray(vocabularyData.primaryVocabularyList)
        ? vocabularyData.primaryVocabularyList
        : [];
    const fullVocabularyList = Array.isArray(vocabularyData.fullVocabularyList)
        ? vocabularyData.fullVocabularyList
        : [];

    const EXAMPLE_POOL = {
        subjects: ['The team', 'Our class', 'The instructor', 'The manager', 'Researchers', 'My friend', 'We', 'They'],
        objects: ['the plan', 'the report', 'the prototype', 'the schedule', 'the system', 'the checklist', 'the project', 'the proposal'],
        contexts: ['the workshop', "today's meeting", 'the briefing', 'the training session', 'the demo', 'the review'],
        goals: ['save time', 'reduce errors', 'keep things on track', 'support the team', 'improve results'],
        times: ['this morning', 'before lunch', 'after the review', 'next week', 'by Friday', 'during the break'],
        supports: ['a mentor', 'our notes', 'a checklist', 'the guide', 'the app'],
        nouns: ['plan', 'strategy', 'prototype', 'solution', 'idea', 'approach', 'policy', 'design'],
        conditions: ['the deadline shifts', 'new data arrives', 'customers ask for updates', 'the schedule changes', 'questions keep coming']
    };

    const EXAMPLE_TEMPLATES = {
        verb: [
            '{subject} decided to {word} {object} before {time}.',
            'We {word} {object} during {context}.',
            'Try to {word} {object} when {condition}.',
            'The team will {word} {object} to {goal}.',
            '{subject} learned to {word} {object} with {support}.',
            'Can you {word} {object} after {time}?'
        ],
        adj: [
            'The {noun} felt {word} after the update.',
            'Everyone agreed the idea was {word}.',
            'Our {noun} became {word} during {context}.',
            'The results seem {word} for now.',
            'We need a {word} approach to {goal}.',
            'The prototype stayed {word} throughout {context}.'
        ],
        adv: [
            'She explained the steps {word} during {context}.',
            'They worked {word} to {goal}.',
            'The team responded {word} when the alert appeared.',
            'He spoke {word} in the briefing.',
            'We moved {word} through the checklist.',
            'The system updated {word} after {time}.'
        ],
        noun: [
            '{Word} came up in today's discussion.',
            'The report highlights {word} as a key topic.',
            'We explored {word} during {context}.',
            '{Word} is central to the next project.',
            'Students asked questions about {word}.',
            'This workshop focuses on {word}.'
        ]
    };
    
    let activeWords = [];
    let currentIndex = 0;
    let currentDifficulty = 'middle';
    
    let knownCount = 0;
    let unknownCount = 0;
    let needReviewWords = [];

    function toggleDifficulty(element) {
        document.querySelectorAll('.unit-card').forEach(card => card.classList.remove('selected'));
        element.classList.add('selected');
    }

    function capitalizeText(text) {
        return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)];
    }

    function buildExampleContext(word) {
        return {
            word,
            Word: capitalizeText(word),
            subject: pickRandom(EXAMPLE_POOL.subjects),
            object: pickRandom(EXAMPLE_POOL.objects),
            context: pickRandom(EXAMPLE_POOL.contexts),
            goal: pickRandom(EXAMPLE_POOL.goals),
            time: pickRandom(EXAMPLE_POOL.times),
            support: pickRandom(EXAMPLE_POOL.supports),
            noun: pickRandom(EXAMPLE_POOL.nouns),
            condition: pickRandom(EXAMPLE_POOL.conditions)
        };
    }

    function fillTemplate(template, context) {
        return template.replace(/\{(\w+)\}/g, (_, key) => context[key] || '');
    }

    function pickExampleTemplates(type) {
        const templates = EXAMPLE_TEMPLATES[type] || EXAMPLE_TEMPLATES.noun;
        const pool = [...templates];
        shuffleArray(pool);
        return pool.slice(0, 2);
    }

    function getExampleTemplateKey(type) {
        if (type.startsWith('v.')) {
            return 'verb';
        }
        if (type.startsWith('adj.')) {
            return 'adj';
        }
        if (type.startsWith('adv.')) {
            return 'adv';
        }
        return 'noun';
    }

    function generateExamples(word, type) {
        const templateKey = getExampleTemplateKey(type);
        const templates = pickExampleTemplates(templateKey);
        return templates.map(template => fillTemplate(template, buildExampleContext(word)));
    }

    function buildMiddleVocabularyList() {
        return fullVocabularyList.map(item => ({
            ...item,
            examples: Array.isArray(item.examples) && item.examples.length > 0
                ? item.examples
                : generateExamples(item.word, item.type)
        }));
    }

    function startLearning() {
        const selectedDifficulty = document.querySelector('.unit-card.selected');
        
        if (!selectedDifficulty) {
            alert('请先选择学习难度哦！');
            return;
        }

        currentDifficulty = selectedDifficulty.getAttribute('data-difficulty');
        
        if (currentDifficulty === 'primary') {
            activeWords = [...primaryVocabularyList];
        } else {
            activeWords = buildMiddleVocabularyList();
        }

        if (activeWords.length === 0) {
            alert('词库加载失败，请刷新后重试。');
            switchScreen('screen-filter');
            return;
        }
        shuffleArray(activeWords);
        
        currentIndex = 0;
        knownCount = 0;
        unknownCount = 0;
        needReviewWords = [];
        
        switchScreen('screen-learn');
        renderCard();
    }
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
    
    function renderCard() {
        if (currentIndex >= activeWords.length) {
            showResults();
            return;
        }
        
        const currentItem = activeWords[currentIndex];
        
        document.getElementById('card-word').textContent = currentItem.word;
        document.getElementById('card-type').textContent = currentItem.type;
        document.getElementById('card-unit').textContent = currentItem.unit;
        document.getElementById('card-meaning').textContent = currentItem.meaning;

        const exampleContainer = document.getElementById('example-container');
        const exampleList = document.getElementById('card-examples');
        if (currentDifficulty === 'middle' && Array.isArray(currentItem.examples) && currentItem.examples.length > 0) {
            exampleList.innerHTML = currentItem.examples.map(example => `<li>${example}</li>`).join('');
            exampleContainer.style.display = 'block';
        } else {
            exampleList.innerHTML = '';
            exampleContainer.style.display = 'none';
        }
        
        document.getElementById('meaning-container').classList.remove('show');
        
        document.getElementById('choice-buttons').style.display = 'flex';
        document.getElementById('continue-buttons').style.display = 'none';
        
        const total = activeWords.length;
        const pct = (currentIndex / total) * 100;
        document.getElementById('progress').style.width = pct + '%';
        document.getElementById('counter').textContent = (currentIndex + 1) + '/' + total;
    }
    
    function handleKnow() {
        knownCount++;
        currentIndex++;
        renderCard();
    }
    
    function handleDontKnow() {
        unknownCount++;
        const currentItem = activeWords[currentIndex];
        if (!needReviewWords.some(w => w.word === currentItem.word)) {
            needReviewWords.push(currentItem);
        }
        
        document.getElementById('meaning-container').classList.add('show');
        
        document.getElementById('choice-buttons').style.display = 'none';
        document.getElementById('continue-buttons').style.display = 'flex';
    }
    
    function advanceNext() {
        currentIndex++;
        renderCard();
    }
    
    function showResults() {
        document.getElementById('progress').style.width = '100%';
        switchScreen('screen-results');
        
        document.getElementById('stat-known').textContent = knownCount;
        document.getElementById('stat-unknown').textContent = unknownCount;
        
        const reviewPanel = document.getElementById('review-panel');
        const container = document.getElementById('review-list-container');
        container.innerHTML = '';
        
        if (needReviewWords.length > 0) {
            reviewPanel.style.display = 'block';
            needReviewWords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'review-item';
                div.innerHTML = `<span class="review-word">${item.word} <small style="color:#afafaf; font-weight:normal;">${item.type}</small></span>
                                 <span class="review-mean">${item.meaning}</span>`;
                container.appendChild(div);
            });
        } else {
            reviewPanel.style.display = 'none';
        }
    }
    
    function quitSession() {
        if (confirm('确定要退出本次学习复习吗？进度不会保存哦~')) {
            restartApp();
        }
    }
    
    function restartApp() {
        switchScreen('screen-filter');
    }
</script>

</body>
</html>
